# Manual scheduler run: pings the app once so it publishes due posts and writes new ones.
# On Netlify the scheduler runs on its own (netlify/functions/tick-schedule.mts), so this is manual-only.
# To use GitHub as the scheduler instead, add back:  schedule: [{ cron: "*/5 * * * *" }]
name: tick
on:
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick"
